spring:
  application:
    name: courseflow

  datasource:
    url: jdbc:mariadb://localhost:3306/courseflow_db
    username: courseflow_user
    password: courseflow_pass
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080