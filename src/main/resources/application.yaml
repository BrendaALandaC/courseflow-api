spring:
  application:
    name: courseflow

  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/courseflow_db}
    username: ${DB_USERNAME:courseflow_user}
    password: ${DB_PASSWORD:courseflow_pass}
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: ${PORT:8080}