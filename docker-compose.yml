version: '3.8'

services:
  db:
    image: mariadb:11
    container_name: courseflow-db
    restart: always
    environment:
      MYSQL_DATABASE: courseflow_db
      MYSQL_USER: courseflow_user
      MYSQL_PASSWORD: courseflow_pass
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: